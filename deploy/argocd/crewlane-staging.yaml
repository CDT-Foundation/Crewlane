# Argo CD Application for staging. Apply once:  kubectl apply -n argocd -f deploy/argocd/crewlane-staging.yaml
# Bump image.tag (e.g. sha-<commit>) in Git to roll out a new build.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crewlane-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CDT-Foundation/Crewlane.git
    targetRevision: dev
    path: deploy/helm/crewlane
    helm:
      valueFiles:
        - values-staging.yaml
      parameters:
        - name: image.tag
          value: sha-REPLACE_WITH_COMMIT_SHA
  destination:
    server: https://kubernetes.default.svc
    namespace: crewlane-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
