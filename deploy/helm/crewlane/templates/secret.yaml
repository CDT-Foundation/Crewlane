{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
{{- range $k := list "databaseUrl" "workerDatabaseUrl" "databaseAdminUrl" "appDbPassword" "workerDbPassword" "betterAuthSecret" "encryptionKey" }}
{{- if not (index $s $k) }}{{ fail (printf "Set secrets.%s or use existingSecret" $k) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crewlane.secretName" . }}
  labels: {{- include "crewlane.labels" . | nindent 4 }}
  annotations:
    # Created before the migration hook runs, kept across upgrades.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ $s.databaseUrl | quote }}
  WORKER_DATABASE_URL: {{ $s.workerDatabaseUrl | quote }}
  DATABASE_ADMIN_URL: {{ $s.databaseAdminUrl | quote }}
  APP_DB_PASSWORD: {{ $s.appDbPassword | quote }}
  WORKER_DB_PASSWORD: {{ $s.workerDbPassword | quote }}
  BETTER_AUTH_SECRET: {{ $s.betterAuthSecret | quote }}
  CREWLANE_ENCRYPTION_KEY: {{ $s.encryptionKey | quote }}
  {{- with $s.s3AccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with $s.s3SecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
