apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crewlane.fullname" . }}
  labels: {{- include "crewlane.labels" . | nindent 4 }}
data:
  ROOT_DOMAIN: {{ .Values.rootDomain | quote }}
  APP_PROTOCOL: {{ ternary "https" "http" .Values.ingress.tls.enabled | quote }}
  PUBLIC_SIGNUP: {{ .Values.publicSignup | toString | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  STORAGE_DRIVER: {{ .Values.storage.driver | quote }}
  S3_BUCKET: {{ .Values.storage.bucket | quote }}
  S3_REGION: {{ .Values.storage.region | quote }}
  S3_ENDPOINT: {{ .Values.storage.endpoint | quote }}
